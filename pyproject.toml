[project]
name = "jev-agent"
version = "0.1.0"
description = "jev-agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Тесты импортируют src и scripts как пакеты от корня проекта.
pythonpath = ["."]
testpaths = ["tests"]
