<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="620" viewBox="0 0 1780 620" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Режим llm-only</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1780" height="620" rx="14" fill="#ffffff"/>
  <text x="28" y="44" font-size="24" font-weight="700" fill="#0f172a">Режим llm-only</text>
  <text x="28" y="72" font-size="16" fill="#64748b">Классификация и извлечение LLM → Python-проверки → ремонт по замечаниям Python; без внешнего верификатора</text>
  <rect x="20" y="200" width="160" height="170" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="240" font-size="21" font-weight="700" fill="#0f172a">Диалог</text>
  <text x="40" y="270" font-size="15" fill="#334155">реплики user</text>
  <text x="40" y="294" font-size="15" fill="#334155">и assistant</text>
  <rect x="290" y="200" width="280" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="290" y="200" width="280" height="5" rx="2" fill="#2563eb"/>
  <text x="310" y="232" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="0.6">LLM</text>
  <text x="310" y="260" font-size="21" font-weight="700" fill="#0f172a">Тип документа</text>
  <text x="310" y="290" font-size="15" fill="#334155">JSON: document_type,</text>
  <text x="310" y="314" font-size="15" fill="#334155">confidence, none_reason</text>
  <text x="310" y="354" font-size="13" fill="#64748b">src/llm.py · classify</text>
  <rect x="670" y="200" width="280" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="670" y="200" width="280" height="5" rx="2" fill="#2563eb"/>
  <text x="690" y="232" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="0.6">LLM</text>
  <text x="690" y="260" font-size="21" font-weight="700" fill="#0f172a">Извлечение полей</text>
  <text x="690" y="290" font-size="15" fill="#334155">значения · цитаты · формулы</text>
  <text x="690" y="314" font-size="15" fill="#334155">ремонт по repair_paths</text>
  <text x="690" y="354" font-size="13" fill="#64748b">src/llm.py · extract</text>
  <rect x="1050" y="200" width="280" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1050" y="200" width="280" height="5" rx="2" fill="#059669"/>
  <text x="1070" y="232" font-size="14" font-weight="700" fill="#059669" letter-spacing="0.6">PYTHON</text>
  <text x="1070" y="260" font-size="21" font-weight="700" fill="#0f172a">Python-проверки</text>
  <text x="1070" y="290" font-size="15" fill="#334155">источники · форматы</text>
  <text x="1070" y="314" font-size="15" fill="#334155">расчёты: AST + Decimal</text>
  <text x="1070" y="354" font-size="13" fill="#64748b">src/extraction.py</text>
  <rect x="1420" y="200" width="340" height="170" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1440" y="240" font-size="21" font-weight="700" fill="#0f172a">JSON</text>
  <text x="1440" y="270" font-size="15" fill="#334155">validation: passed</text>
  <text x="1440" y="294" font-size="15" fill="#334155">semantic_status: not_run</text>
  <rect x="310" y="480" width="240" height="90" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="330" y="520" font-size="21" font-weight="700" fill="#0f172a">Причина, полей нет</text>
  <text x="330" y="550" font-size="15" fill="#334155">reason · fields = {}</text>
  <rect x="950" y="480" width="480" height="110" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="970" y="520" font-size="21" font-weight="700" fill="#0f172a">Лучший кандидат · needs_review</text>
  <text x="970" y="550" font-size="15" fill="#334155">прошёл Python → меньше непроверенных полей</text>
  <text x="970" y="574" font-size="15" fill="#334155">→ более поздний</text>
  <path d="M180 285 H286" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M570 285 H666" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="620" y="274" font-size="14" fill="#475569" text-anchor="middle">счёт / перевод</text>
  <path d="M950 285 H1046" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1000" y="274" font-size="14" fill="#475569" text-anchor="middle">кандидат</text>
  <path d="M1330 285 H1416" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1375" y="274" font-size="14" fill="#475569" text-anchor="middle">ок</text>
  <path d="M430 370 V476" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="442" y="430" font-size="14" fill="#475569" text-anchor="start">none</text>
  <path d="M1190 200 V130 H810 V196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1000" y="120" font-size="14" fill="#475569" text-anchor="middle">ошибка, есть попытки → ремонт</text>
  <path d="M1190 370 V476" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1202" y="430" font-size="14" fill="#475569" text-anchor="start">попытки исчерпаны</text>
</svg>
