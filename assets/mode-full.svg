<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="620" viewBox="0 0 1780 620" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Режим full</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1780" height="620" rx="14" fill="#ffffff"/>
  <text x="28" y="44" font-size="24" font-weight="700" fill="#0f172a">Режим full</text>
  <text x="28" y="72" font-size="16" fill="#64748b">Классификация Jev → извлечение LLM → Python-проверки → смысловая проверка Jev → ограниченный ремонт</text>
  <rect x="20" y="200" width="160" height="170" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="240" font-size="21" font-weight="700" fill="#0f172a">Диалог</text>
  <text x="40" y="270" font-size="15" fill="#334155">реплики user</text>
  <text x="40" y="294" font-size="15" fill="#334155">и assistant</text>
  <rect x="290" y="200" width="250" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="290" y="200" width="250" height="5" rx="2" fill="#ea580c"/>
  <text x="310" y="232" font-size="14" font-weight="700" fill="#ea580c" letter-spacing="0.6">JEV</text>
  <text x="310" y="260" font-size="21" font-weight="700" fill="#0f172a">Тип документа</text>
  <text x="310" y="290" font-size="15" fill="#334155">choice: invoice_draft,</text>
  <text x="310" y="314" font-size="15" fill="#334155">transfer_draft или none</text>
  <text x="310" y="354" font-size="13" fill="#64748b">src/cases/document_type.py</text>
  <rect x="640" y="200" width="250" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="640" y="200" width="250" height="5" rx="2" fill="#2563eb"/>
  <text x="660" y="232" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="0.6">LLM</text>
  <text x="660" y="260" font-size="21" font-weight="700" fill="#0f172a">Извлечение полей</text>
  <text x="660" y="290" font-size="15" fill="#334155">значения · цитаты · формулы</text>
  <text x="660" y="314" font-size="15" fill="#334155">ремонт по repair_paths</text>
  <text x="660" y="354" font-size="13" fill="#64748b">src/llm.py</text>
  <rect x="990" y="200" width="250" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="990" y="200" width="250" height="5" rx="2" fill="#059669"/>
  <text x="1010" y="232" font-size="14" font-weight="700" fill="#059669" letter-spacing="0.6">PYTHON</text>
  <text x="1010" y="260" font-size="21" font-weight="700" fill="#0f172a">Python-проверки</text>
  <text x="1010" y="290" font-size="15" fill="#334155">источники · форматы</text>
  <text x="1010" y="314" font-size="15" fill="#334155">расчёты: AST + Decimal</text>
  <text x="1010" y="354" font-size="13" fill="#64748b">src/extraction.py</text>
  <rect x="1310" y="200" width="250" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="1310" y="200" width="250" height="5" rx="2" fill="#ea580c"/>
  <text x="1330" y="232" font-size="14" font-weight="700" fill="#ea580c" letter-spacing="0.6">JEV</text>
  <text x="1330" y="260" font-size="21" font-weight="700" fill="#0f172a">Проверка смысла</text>
  <text x="1330" y="290" font-size="15" fill="#334155">noul-вопросы по полям</text>
  <text x="1330" y="314" font-size="15" fill="#334155">P(ошибка) ≥ 0,8 → замечание</text>
  <text x="1330" y="354" font-size="13" fill="#64748b">src/verification.py</text>
  <rect x="1650" y="200" width="110" height="170" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1670" y="240" font-size="21" font-weight="700" fill="#0f172a">JSON</text>
  <text x="1670" y="270" font-size="15" fill="#334155">passed</text>
  <rect x="295" y="480" width="240" height="90" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="315" y="520" font-size="21" font-weight="700" fill="#0f172a">Причина, полей нет</text>
  <text x="315" y="550" font-size="15" fill="#334155">reason · fields = {}</text>
  <rect x="1030" y="480" width="490" height="110" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="1050" y="520" font-size="21" font-weight="700" fill="#0f172a">Лучший кандидат · needs_review</text>
  <text x="1050" y="550" font-size="15" fill="#334155">прошёл Python → меньше непроверенных полей</text>
  <text x="1050" y="574" font-size="15" fill="#334155">→ более поздний</text>
  <path d="M180 285 H286" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M540 285 H636" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="590" y="274" font-size="14" fill="#475569" text-anchor="middle">счёт / перевод</text>
  <path d="M890 285 H986" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="940" y="274" font-size="14" fill="#475569" text-anchor="middle">кандидат</text>
  <path d="M1240 285 H1306" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1275" y="274" font-size="14" fill="#475569" text-anchor="middle">ок</text>
  <path d="M1560 285 H1646" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1605" y="274" font-size="14" fill="#475569" text-anchor="middle">принято</text>
  <path d="M415 370 V476" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="427" y="430" font-size="14" fill="#475569" text-anchor="start">none</text>
  <path d="M1115 200 V150 H800 V196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="957" y="140" font-size="14" fill="#475569" text-anchor="middle">ошибка Python → ремонт</text>
  <path d="M1435 200 V112 H730 V196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1082" y="102" font-size="14" fill="#475569" text-anchor="middle">смысловые замечания → ремонт (repair_paths)</text>
  <path d="M1115 370 V476" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1127" y="430" font-size="14" fill="#475569" text-anchor="start">попытки исчерпаны</text>
  <path d="M1435 370 V476" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
